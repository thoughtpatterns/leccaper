[project]
name = "leccaper"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32.5",
    "selenium>=4.29.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["uv_build>=0.8.14"]
build-backend = "uv_build"

[project.scripts]
leccaper = "leccaper:cli"

[tool.basedpyright]
include = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["ANN401", "D", "E731"]
